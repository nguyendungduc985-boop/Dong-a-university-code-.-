<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bộ sưu tập ảnh</title>
  <style>
    .picture {
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 15px; 
      max-width: 900px; 
      margin: auto; 
    }
    .picture img {
      width: 100%; 
      height: 200px;       
      object-fit: cover;   
      border: 3px solid yellow;
      border-radius: 15px; 
    }
    .picture img:hover {
      border-color: aqua;  
    }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Bộ sưu tập ảnh</h2>
  <div class="picture">
    <img src="picture/logo.png/iphone 17.jpg" alt="Ảnh 1">
    <img src="picture/logo.png/iphone 17.jpg" alt="Ảnh 2">
    <img src="picture/logo.png/iphone 17.jpg" alt="Ảnh 3">
    <img src="picture/logo.png/iphone 17.jpg" alt="Ảnh 4">
    <img src="picture/logo.png/iphone 17.jpg" alt="Ảnh 5">
    <img src="picture/logo.png/iphone 17.jpg" alt="Ảnh 6">
    <img src="picture/logo.png/iphone 17.jpg" alt="Ảnh 7">
    <img src="picture/logo.png/iphone 17.jpg" alt="Ảnh 8">
  </div>
</body>
</html>
