<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>3 Box ngang</title>
  <style>
    .box1 {
  border: 2px solid red;
  width: 100px;
  height: 100px;
  display: inline-block;
  margin: 5px;
  background-color: red;   /* tô nền đỏ */
  font-size: 30px; color: white; 
}
.box2 {
  border: 2px solid aqua;
  width: 125px;
  height: 100px;
  display: inline-block;
  margin: 5px;
  background-color: aqua;  /* tô nền xanh ngọc */
  font-size: 30px; color: white;
}
.box3 {
  border: 2px solid blue;
  width: 150px;
  height: 100px;
  display: inline-block;
  margin: 5px;
  background-color: blue;  /* tô nền xanh dương */
  font-size: 30px; color: white;
}
.box1 p, .box2 p, .box3 p {
  margin: 0;       
  padding-top: 5px; 
}
  </style>
</head>
<body>
  <div class="box1"><p>Box 1</p></div>
  <div class="box2"><p>Box 2</p></div>
  <div class="box3"><p>Box 3</p></div>
</body>
</html>
