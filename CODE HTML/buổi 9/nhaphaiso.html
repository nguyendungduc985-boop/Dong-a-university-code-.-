<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính tổng hai số</title>
</head> 
<body>
    <h4>Viết chương trình yêu cầu người dùng nhập hai số, sau đó hiển thị tổng của chúng bằng alert()</h4>
    <script>
        let a = Number(prompt("Nhập số thứ nhất:"));
        let b = Number(prompt("Nhập số thứ hai:"));
        let sum = a + b;
        alert("Tổng của " + a + " và " + b + " là " + sum);
    </script>
</body>
</html>
