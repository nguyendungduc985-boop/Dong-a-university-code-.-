<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đại học Đông Á</title>
  <style>
    body {
      font-family: "Times New Roman", serif;
      background-color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 80%;
      margin: 0 auto;
      border: 1px solid #ccc;
      padding-bottom: 20px;
    }

    header {
      padding: 10px 0;
    }

    .logo {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .logo-image { 
      width: 100px;
      height: auto;
    }

    .title {
      font-style: italic;
      font-size: 16px;
      color: #333;
      margin: 0;
    }

    h1 {
      color: #009944;
      font-size: 36px;
      margin: 10px 0;
      font-weight: bold;
    }

    .menu {
      border-top: 1px solid #888;
      border-bottom: 1px solid #888;
      padding: 10px 0;
    }

    .menu a {
      display: inline-block;
      color: blue;
      font-variant: small-caps;
      text-decoration: none;
      font-size: 18px;
      margin: 0 5px;
      transition: color 0.3s;
    }

    .menu a:hover {
      color: red;
      text-decoration: underline;
    }

    .menu a:visited {
      color: green;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <img src="picture/logo.png/logo-dai-hoc-dong-a-inkythuatso-01.jpg" alt="Logo Đại học Đông Á" class="logo-image">
        <small><p class="title">Tạo dựng con đường thành công</p></small>
      </div>
      <h1>ĐẠI HỌC ĐÔNG Á</h1>
    </header>

    <div class="menu">
      <a href="https://donga.edu.vn/">TRANG CHỦ</a> |
      <a href="https://donga.edu.vn/gioi-thieu">GIỚI THIỆU</a> |
      <a href="https://donga.edu.vn/lien-he">LIÊN HỆ</a> |
      <a href="https://donga.edu.vn/gopy">GÓP Ý</a> |
      <a href="https://donga.edu.vn/tuyensinh">TUYỂN SINH</a>
    </div>
  </div>
</body>
</html>
